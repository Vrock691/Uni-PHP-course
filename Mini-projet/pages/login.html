<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/app.css">
    <title>Connexion à votre compte</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="[onshow.cible]">Fil</a></li>
            <li><a href="[onshow.cible]?view=account" class="selected">Profil</a></li>
            <li><a href="[onshow.cible]?view=post">[postText]</a></li>
        </ul>
    </nav>
    <form action="[onshow.cible]?view=login" method="post" class="login-form">
        <h1>[loginMessage]</h1>
        <fieldset>
            <legend>Identification</legend>
            <label for="userID">ID du compte</label>
            <input type="text" id="userID" name="userID" required />
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required />
            <label for="submit"></label>
            <input type="submit" id="submit" value="Valider" />
        </fieldset>
    </form>
</body>
</html>
