<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/app.css">
    <title>Blog</title>
</head>

<body>
    <nav>
        <ul>
            <li><a href="[onshow.cible]">Fil</a></li>
            <li><a href="[onshow.cible]?view=account" class="selected">Profil</a></li>
            <li><a href="[onshow.cible]?view=post">[postText]</a></li>
        </ul>
    </nav>
    <main>
        <header>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="30" height="30">
                <path fill-rule="evenodd"
                    d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                    clip-rule="evenodd" />
            </svg>
            
            <form action="[onshow.cible]?view=account" method="post">
                <input class="transparent-input" style="font-size: 2em; font-weight: bold;" type="text" name="name" id="name" placeholder="Entrez un nom" required value="[name]"/>
                <a href="[onshow.cible]?view=logout" style="display: block;">Déconnexion</a>
                
                <div class="otherinfos">
                    <p>Bio</p>
                    <input type="text" name="bio" id="bio" placeholder="Entrez votre bio" required value="[bio]"/>
                
                    <p>Statut</p>
                    <input type="text" name="status" id="status" placeholder="Entrez votre status" required value="[status]"/>
                    
                    <button type="submit">Modifier mes informations</button>
                </div>
            </form>
        </header>
        <section>
            <h2>Vos posts</h2>
            [posts;block=begin]
            <article id="[posts.id]" class="post-card" onclick="location.href='[onshow.cible]?view=article&id=[posts.id]'">
                <h3>[posts.title]</h3>
                <p>[posts.desc]</p>
                <p class="from">De [posts.name] - posté le [posts.created_at]</p>
            </article>
            [posts;block=end]
        </section>
    </main>
</body>

</html>
