<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/home.css">
    <title>Blog</title>
</head>

<body>
    <nav>
        <ul>
            <li><a href="[onshow.cible]" class="selected">Fil</a></li>
            <li><a href="[onshow.cible]?view=account">Profil</a></li>
        </ul>
    </nav>
    <main>
        <header>
            <h1>Bienvenue sur votre fil</h1>
            <p>Partagez vos idées et vos passions avec le monde !</p>
        </header>
        <section>
            <h2>Derniers posts</h2>
            <article id="[feed.id;block=begin]">
                <h3>[feed.title]</h3>
                <p>[feed.desc]</p>
                <p>De [feed.name] - posté le [feed.created_at]</p>
            </article>
            [feed.id;block=end]
        </section>
    </main>
</body>

</html>
